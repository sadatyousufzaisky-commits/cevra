name: Windows reliability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Prepare Electron for desktop tests
        run: |
          node -e "require('electron')"
          if ($LASTEXITCODE -eq 0) { exit 0 }
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Warning "Preparing Electron through the GitHub release-assets API (attempt $attempt)."
            node qa/cache-electron-release.cjs
            if ($LASTEXITCODE -eq 0) {
              node -e "require('electron')"
              if ($LASTEXITCODE -eq 0) { exit 0 }
            }
            if ($attempt -lt 2) { Start-Sleep -Seconds 2 }
          }
          exit 1
      - run: npm test
      - name: Verify Windows credential account separation
        run: pwsh -NoProfile -File qa/test-credential-account.ps1
      - name: Verify extension host isolation
        env:
          CEVRA_TEST_CLIPBOARD: '1'
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, BuildNumber | Format-List
          npm run test:extension-host
      - name: Reproduce the Intelligence benchmark on Windows
        env:
          CEVRA_PHASE5_SAMPLES: '3'
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'cevra-phase4-benchmark'
          git fetch --no-tags --depth=1 origin 4960ef251237583f9ee7a21e067f949dd2f6d4b0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git worktree add --detach $baseline FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cache = Join-Path $baseline 'dist/g3-runtime'
          New-Item -ItemType Directory -Path $cache | Out-Null
          Copy-Item -LiteralPath 'dist/g3-runtime/zig-0.15.2.zip','dist/g3-runtime/wasmtime-v36.0.20.zip' -Destination $cache
          Push-Location -LiteralPath $baseline
          try {
            $env:ELECTRON_SKIP_BINARY_DOWNLOAD = '1'
            npm ci
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $env:CEVRA_PHASE5_BASELINE = $baseline
          node --test qa/intelligence-benchmark.test.cjs
