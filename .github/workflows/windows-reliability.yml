name: Windows reliability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Prepare Electron for desktop tests
        run: |
          node -e "require('electron')"
          if ($LASTEXITCODE -eq 0) { exit 0 }
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Warning "Preparing Electron through the GitHub release-assets API (attempt $attempt)."
            node qa/cache-electron-release.cjs
            if ($LASTEXITCODE -eq 0) {
              node -e "require('electron')"
              if ($LASTEXITCODE -eq 0) { exit 0 }
            }
            if ($attempt -lt 2) { Start-Sleep -Seconds 2 }
          }
          exit 1
      - run: npm test
