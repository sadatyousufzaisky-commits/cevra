name: Windows reliability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Prepare Electron for desktop tests
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            node -e "require('electron')"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Warning "Electron setup attempt $attempt failed. Retrying."
              Start-Sleep -Seconds (2 * $attempt)
            }
          }
          exit 1
      - run: npm test
